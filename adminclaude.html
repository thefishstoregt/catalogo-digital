const normP = p => { const ok = p.available!==false && (Number.isFinite(Number(p.stock)) ? Number(p.stock)>0 : true); return {...p, stock: ok?999:0, available: ok}; };
const RENAME_SEACHEM = n => String(n).replace(/^Seachem /, "").replace("GarlicGuard", "Garlic Guard");
// Misma lógica que el índice: une el catálogo guardado con la lista incluida en la página.
function normalizarLista(lista){
  return lista.filter(p => p && p.name).map(p => {
    if(p.category === "Seachem") p = {...p, name: RENAME_SEACHEM(p.name)};
    if(p.category === "Grava y Sustratos") p = {...p, category: "Grava, Sustrato, Rocas y Raices"};
    const b = products.find(x => x.name === p.name);
    if(b && b.imagen && !/^data:/.test(p.imagen || "")) p = {...p, imagen: b.imagen};
    return p;
  });
}
function mezclarCatalogo(lista){
  lista = normalizarLista(lista);
  let known = null; try{ known = JSON.parse(localStorage.getItem("fishAdminKnown") || "null"); }catch(e){}
  const k = new Set(Array.isArray(known) ? known : []);
  const nuevos = products.filter(p => !k.has(p.name) && !lista.some(x => x.name === p.name));
  return [...lista, ...nuevos];
}
const savedCatalog = (()=>{try{return JSON.parse(localStorage.getItem("fishAdminCatalog")||localStorage.getItem("fishCatalogProducts")||"null")}catch(e){return null}})();
let productsState = (Array.isArray(savedCatalog) && savedCatalog.length ? mezclarCatalogo(savedCatalog) : products.map(p=>({...p}))).map(normP);
function toast(msg,ok){
  let d=document.getElementById("toastAdmin");
  if(!d){ d=document.createElement("div"); d.id="toastAdmin"; d.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:10px;font:600 14px system-ui,sans-serif;z-index:99999;box-shadow:0 4px 18px rgba(0,0,0,.3);transition:opacity .3s"; document.body.appendChild(d); }
  d.textContent=msg; d.style.background=ok?"#1f7a45":"#a11d1d"; d.style.color="#fff"; d.style.opacity="1";
  clearTimeout(d._t); d._t=setTimeout(()=>d.style.opacity="0",ok?1800:5000);
}
function saveCatalog(){
  productsState.forEach(p => {
    p.stock = Math.max(0, Number(p.stock) || 0);
    p.available = p.stock > 0 && p.available !== false;
  });
  const data = JSON.stringify(productsState), known = JSON.stringify(products.map(p=>p.name));
  const guardar = () => { localStorage.setItem("fishAdminCatalog", data); localStorage.setItem("fishAdminKnown", known); };
  try{ guardar(); toast("Guardado ✓",true); return true; }
  catch(e){
    // Sin espacio: se borran copias duplicadas que el índice recrea solo y se reintenta.
    try{ localStorage.removeItem("fishCatalogProducts"); guardar(); toast("Guardado ✓",true); return true; }
    catch(e2){
      toast("No se pudo guardar: el navegador no tiene espacio. Usa imágenes más pequeñas o descarga catalogo.json.",false);
      throw e2;
    }
  }
}
function getProduct(name){ return productsState.find(p=>p.name===name); }
const money = n => "Q" + n.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});

const HASH_DEFAULT="0a00779aaa6544e7548d73244d531e3d7d9d6e054af8ee177a7ff75933117d4e";
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function categories(){} function render(){}
async function hashPass(t){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function mostrarAdminLogin(){
  document.getElementById("adminContent").innerHTML='<div class="admin-login"><p>Acceso exclusivo del administrador.</p><label>Contraseña</label><input id="adminPass" type="password" placeholder="Contraseña" onkeydown="if(event.key===\'Enter\')entrarAdmin()"><button onclick="entrarAdmin()">Entrar al panel</button></div>';
}
async function entrarAdmin(){
  try{
    const h=await hashPass(document.getElementById("adminPass").value);
    if(h!==(localStorage.getItem("fishAdminHash2")||HASH_DEFAULT)){ alert("Contraseña incorrecta."); return; }
    sessionStorage.setItem("fishAdminOk","1"); mostrarAdmin();
  }catch(e){ alert("Abre el panel desde https:// o como archivo local."); }
}
function salirAdmin(){ sessionStorage.removeItem("fishAdminOk"); mostrarAdminLogin(); }
async function cambiarClave(){
  const n=prompt("Nueva contraseña (mínimo 6 caracteres):");
  if(!n||n.length<6){ alert("Contraseña no válida."); return; }
  localStorage.setItem("fishAdminHash2",await hashPass(n)); alert("Contraseña actualizada.");
}
async function leerPublicado(){
  const fuentes=[];
  const m=location.hostname.match(/^(.+)\.github\.io$/), seg=location.pathname.split("/")[1];
  if(m){ const repo=(seg && !/\.html?$/.test(seg)) ? seg : location.hostname;
    fuentes.push({u:`https://api.github.com/repos/${m[1]}/${repo}/contents/catalogo.json`,h:{Accept:"application/vnd.github.raw+json"}}); }
  fuentes.push({u:"catalogo.json?t="+Date.now(),h:{}});
  for(const x of fuentes){
    try{ const r=await fetch(x.u,{cache:"no-store",headers:x.h}); if(!r.ok) continue;
      const d=JSON.parse(await r.text()); if(Array.isArray(d)&&d.length) return d; }catch(e){}
  }
  return null;
}
async function cargarPublicado(manual){
  if(manual && !confirm("Se reemplazará lo que tienes en el panel por el catalogo.json publicado. ¿Continuar?")) return;
  const d=await leerPublicado();
  if(!d){ if(manual) alert("No se pudo leer catalogo.json. Abre el admin desde tu sitio publicado (no como archivo local) y revisa que catalogo.json esté en la misma carpeta."); return; }
  productsState=normalizarLista(d).map(normP);
  try{ saveCatalog(); }catch(e){}
  if(typeof mostrarAdmin==="function" && sessionStorage.getItem("fishAdminOk")) mostrarAdmin();
  if(manual) toast("Catálogo publicado cargado ✓",true);
}
function exportarCatalogo(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(productsState)],{type:"application/json"}));
  a.download="catalogo.json"; a.click(); URL.revokeObjectURL(a.href);
}
function importarCatalogo(inp){
  const f=inp.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    if(!Array.isArray(d)||!d.every(p=>p&&p.name&&p.category&&Number.isFinite(Number(p.price)))) throw 0;
    productsState=d.map(normP); saveCatalog(); mostrarAdmin(); alert("Catálogo importado.");
  }catch(e){ alert("Archivo no válido."); } };
  r.readAsText(f);
}
function mostrarAdmin(){
  const c=document.getElementById("adminContent");
  const cats=[...new Set(productsState.map(p=>p.category))];
  c.innerHTML=`
    <div class="admin-tools"><input id="adminSearch" placeholder="Buscar producto..." oninput="renderAdminTable()"><select id="adminFilter" onchange="renderAdminTable()"><option value="Todos">Todas las categorías</option>${cats.map(x=>`<option>${esc(x)}</option>`).join("")}</select><button class="small-btn" onclick="exportarCatalogo()">Descargar catalogo.json</button><button class="small-btn" onclick="cargarPublicado(true)">Cargar publicado</button><label class="small-btn" style="cursor:pointer">Importar<input type="file" accept=".json" hidden onchange="importarCatalogo(this)"></label><button class="small-btn" onclick="cambiarClave()">Cambiar contraseña</button><a class="small-btn" href="index.html?borrador=1" target="_blank">Vista previa</a><button class="small-btn" onclick="salirAdmin()">Cerrar sesión</button></div>
    <p style="margin:8px 0;font-size:13px;opacity:.8">Los cambios se guardan como borrador en este navegador. Para publicarlos: «Descargar catalogo.json» y sube ese archivo al sitio (reemplaza el anterior). El catálogo público se actualiza solo en ~1 minuto.</p>
    <form class="admin-form" onsubmit="agregarProducto(event)"><input id="newName" required placeholder="Nombre del producto"><input id="newPrice" required type="number" min="0" step="0.01" placeholder="Precio"><select id="newCat" required>${cats.map(x=>`<option>${esc(x)}</option>`).join("")}<option value="__nueva__">+ Nueva categoría</option></select><input id="newImage" type="file" accept="image/*"><button>Agregar producto</button></form>
    <div id="adminTable"></div>`;
  renderAdminTable();
}
function renderAdminTable(){
  const box=document.getElementById("adminTable"); if(!box) return;
  const q=(document.getElementById("adminSearch")?.value||"").toLowerCase();
  const cat=document.getElementById("adminFilter")?.value||"Todos";
  const list=productsState.filter(p=>(cat==="Todos"||p.category===cat)&&p.name.toLowerCase().includes(q));
  box.innerHTML=`<div style="overflow:auto"><table class="admin-table"><thead><tr><th>Producto</th><th>Precio</th><th>Categoría</th><th>Imagen</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${list.map((p)=>{const i=productsState.indexOf(p);return `<tr><td><input id="name-${i}" value="${esc(p.name)}"></td><td><input id="price-${i}" type="number" min="0" step="0.01" value="${p.price}"></td><td><input id="cat-${i}" value="${esc(p.category)}"></td><td><div style="display:flex;flex-direction:column;gap:6px;min-width:150px">${p.imagen ? `<img src="${p.imagen}" alt="${esc(p.name)}" style="width:70px;height:55px;object-fit:contain;border-radius:7px;background:#071016;border:1px solid rgba(255,255,255,.1)">` : '<span style="color:#8e9aa1;font-size:12px">Sin imagen</span>'}<input id="image-${i}" type="file" accept="image/*"></div></td><td class="${p.stock>0?'status-ok':'status-out'}">${p.stock>0?'DISPONIBLE':'AGOTADO'}</td><td><div class="admin-actions"><button onclick="guardarProducto(${i})">Guardar</button><button onclick="cambiarEstado(${i})">${p.available?'Marcar agotado':'Poner disponible'}</button><button onclick="eliminarProducto(${i})">Eliminar</button></div></td></tr>`}).join("")}</tbody></table></div>`;
}

function guardarProducto(i){
  const nombre=document.getElementById(`name-${i}`).value.trim(); const precio=parseFloat(document.getElementById(`price-${i}`).value); const categoria=document.getElementById(`cat-${i}`).value.trim(); const archivo=document.getElementById(`image-${i}`).files[0];
  if(!nombre||isNaN(precio)||precio<0||!categoria){alert("Completa correctamente los datos.");return;}
  if(archivo && !archivo.type.startsWith("image/")){alert("Selecciona una imagen válida.");return;}
  productsState[i].name=nombre; productsState[i].price=precio; productsState[i].category=categoria;
  if(!archivo){ saveCatalog(); categories(); render(); mostrarAdmin(); return; }
  const lector=new FileReader();
  lector.onload=function(){
    const img=new Image();
    img.onload=function(){
      const max=900, escala=Math.min(1,max/Math.max(img.width,img.height));
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(img.width*escala));
      canvas.height=Math.max(1,Math.round(img.height*escala));
      const ctx=canvas.getContext("2d");
      ctx.fillStyle="#ffffff";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      productsState[i].imagen=canvas.toDataURL("image/png",0.80);
      try{
        saveCatalog(); categories(); render(); mostrarAdmin();
      }catch(err){
        alert("La imagen es demasiado grande para guardarla. Prueba con una imagen más pequeña.");
      }
    };
    img.onerror=function(){alert("No se pudo cargar la imagen.");};
    img.src=lector.result;
  };
  lector.readAsDataURL(archivo);
}
function cambiarEstado(i){
  if (productsState[i].stock > 0) {
    productsState[i].stock = 0;
    productsState[i].available = false;
  } else {
    productsState[i].stock = 999;
    productsState[i].available = true;
  }
  saveCatalog(); categories(); render(); mostrarAdmin();
}
function eliminarProducto(i){ if(!confirm(`¿Eliminar ${productsState[i].name}?`)) return; productsState.splice(i,1); saveCatalog(); categories(); render(); mostrarAdmin(); }
function agregarProducto(e){
  e.preventDefault();
  const nombre=document.getElementById("newName").value.trim();
  const precio=parseFloat(document.getElementById("newPrice").value);
  let categoria=document.getElementById("newCat").value;
  const archivo=document.getElementById("newImage").files[0];
  if(categoria==="__nueva__"){ categoria=prompt("Nombre de la nueva categoría:"); if(!categoria||!categoria.trim()) return; categoria=categoria.trim(); }
  if(!nombre||isNaN(precio)||precio<0||!categoria){alert("Completa correctamente los datos.");return;}
  if(!archivo){
    productsState.push({name:nombre,price:precio,category:categoria,stock:999,available:true});
    saveCatalog(); categories(); render(); mostrarAdmin();
    return;
  }
  if(!archivo.type.startsWith("image/")){alert("Selecciona una imagen válida.");return;}
  const lector=new FileReader();
  lector.onload=function(){
    const img=new Image();
    img.onload=function(){
      const max=900, escala=Math.min(1,max/Math.max(img.width,img.height));
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(img.width*escala));
      canvas.height=Math.max(1,Math.round(img.height*escala));
      const ctx=canvas.getContext("2d");
      ctx.fillStyle="#ffffff";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const imagen=canvas.toDataURL("image/png",0.80);
      productsState.push({name:nombre,price:precio,category:categoria,imagen:imagen,stock:999,available:true});
      try{
        saveCatalog(); categories(); render(); mostrarAdmin();
      }catch(err){
        alert("La imagen es demasiado grande para guardarla. Prueba con una imagen más pequeña.");
      }
    };
    img.onerror=function(){alert("No se pudo cargar la imagen.");};
    img.src=lector.result;
  };
  lector.readAsDataURL(archivo);
}

if(sessionStorage.getItem("fishAdminOk")) mostrarAdmin(); else mostrarAdminLogin();
if(!(Array.isArray(savedCatalog)&&savedCatalog.length)) cargarPublicado(false);
